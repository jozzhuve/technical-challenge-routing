openapi: 3.0.3
info:
  title: Optimal Routing API
  version: 1.0.0
  description: Calcula la ruta de menor distancia desde la base de grúas más cercana hasta la ubicación del accidente.
servers:
  - url: http://localhost:8081
paths:
  /api/v1/routes/optimal:
    post:
      summary: Calcula la ruta óptima entre múltiples bases y un accidente
      operationId: calculateOptimalRoute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteRequest'
      responses:
        '200':
          description: Ruta óptima encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteResponse'
        '400':
          description: Entrada inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Ninguna base puede alcanzar el destino
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /routes/optimal:
    post:
      summary: Alias simple para cálculo de ruta óptima
      operationId: calculateOptimalRouteAlias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteRequest'
      responses:
        '200':
          description: Ruta óptima encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteResponse'
  /health:
    get:
      summary: Verifica disponibilidad del servicio
      responses:
        '200':
          description: Servicio disponible
components:
  schemas:
    RouteRequest:
      type: object
      required: [accidentLocation, depots, graph]
      properties:
        accidentLocation:
          type: string
          example: San Isidro
        depots:
          type: array
          minItems: 1
          items:
            type: string
          example: [Miraflores, Ate]
        graph:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: number
              minimum: 0
          example:
            Miraflores:
              San Isidro: 7
              Barranco: 3
            San Isidro:
              Miraflores: 7
              Lince: 4
    RouteResponse:
      type: object
      required: [fromDepot, to, path, distance]
      properties:
        fromDepot:
          type: string
          example: Miraflores
        to:
          type: string
          example: San Isidro
        path:
          type: array
          items:
            type: string
          example: [Miraflores, San Isidro]
        distance:
          type: number
          example: 7
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
